name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: degree_dean_test
          POSTGRES_USER: degreedean
          POSTGRES_PASSWORD: degreedean_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U degreedean -d degree_dean_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test API
        working-directory: apps/api
        run: mvn -B test
      - name: SBOM
        working-directory: apps/api
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm test
      - working-directory: apps/web
        run: npm run build

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks if available)
        run: |
          if command -v gitleaks >/dev/null; then gitleaks detect --source . --no-git; else echo "gitleaks not installed on runner; skipped"; fi
